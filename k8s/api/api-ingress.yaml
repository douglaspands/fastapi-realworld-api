apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: realworld
  # labels:
  #   app: api-ingress
  # annotations:
  #   nginx.ingress.kubernetes.io/use-regex: "true"
  #   nginx.ingress.kubernetes.io/rewrite-target: /$2    
spec:
  # ingressClassName: nginx
  rules:
  - http:
      paths:
      - pathType: Prefix
        # path: /realworld/api(/|$)(.*)
        path: /api
        backend:
          service:
            name: api-service
            port:
              number: 8080
