apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deploy
  namespace: realworld
  labels:
    app: api-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-deploy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: api-deploy
    spec:
      containers:
        - name: api-pod
          image: localhost:5001/fastapi-realword-api:latest
          imagePullPolicy: Always
          command:
            - "uvicorn"
            - "main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          ports:
            - containerPort: 8000
          env:
            - name: db_url
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: db_url
            - name: token_secret_key
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: token_secret_key
          livenessProbe:
            httpGet:
              path: /health/v1/liveness
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/v1/readiness
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
