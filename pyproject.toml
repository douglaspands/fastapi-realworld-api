[project]
name = "fastapi-realworld-api"
version = "0.7.0"
description = "Exemplo de projeto com FastAPI e SQLModel usando async/await"
authors = [{ name = "Douglas Panhota", email = "douglaspands@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi[standard] (>=0.121.2,<0.122.0)",
    "sqlmodel (>=0.0.27,<0.0.28)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "aiosqlite (>=0.21.0,<0.22.0)",
    "pydash (>=8.0.5,<9.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "alembic (>=1.17.2,<2.0.0)",
    "psycopg[binary,pool] (>=3.2.12,<4.0.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "json-logging>=1.5.1",
    "httpx>=0.28.1",
    "ipython>=9.8.0",
    "typer>=0.24.1",
]

[dependency-groups]
dev = [
    "ruff (>=0.14.5,<0.15.0)",
    "pytest (>=9.0.1,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-env (>=1.2.0,<2.0.0)",
    "pytest-xdist>=3.8.0",
    "rich (>=14.2.0,<15.0.0)",
    "faker (>=38.0.0,<39.0.0)",
    "types-python-jose (>=3.5.0.20250531,<4.0.0.0)",
    "ty>=0.0.6",
    "art>=6.5",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
python_files = "test_*.py"
# testpaths = "tests"
norecursedirs = ["__pycache__"]
asyncio_mode = "auto"

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[project.scripts]
server = 'scripts.project:server'
lint = 'scripts.project:lint'
format = 'scripts.project:format'
unit_test = 'scripts.project:unit_test'
integration_test = 'scripts.project:integration_test'
build = 'scripts.project:build'
# migrations
migrate = 'scripts.project:migrate'
sqlmigrate = 'scripts.project:sqlmigrate'
makemigrations = 'scripts.project:make_migrations'
# production
prodution_server = 'scripts.project:prodution_server'
# docker
makerequirements = 'scripts.project:make_requirements'
