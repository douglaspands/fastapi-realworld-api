[project]
name = "fastapi-realworld-api"
version = "0.4.0"
description = ""
authors = [
    {name = "Douglas Panhota", email = "douglaspands@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi[standard] (>=0.121.2,<0.122.0)",
    "sqlmodel (>=0.0.27,<0.0.28)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "aiosqlite (>=0.21.0,<0.22.0)",
    "pydash (>=8.0.5,<9.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "alembic (>=1.17.2,<2.0.0)",
    "psycopg[binary,pool] (>=3.2.12,<4.0.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.5,<0.15.0)",
    "pytest (>=9.0.1,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "mypy (>=1.18.2,<2.0.0)",
    "rich (>=14.2.0,<15.0.0)",
    "faker (>=38.0.0,<39.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "types-passlib (>=1.7.7.20250602,<2.0.0.0)",
    "types-python-jose (>=3.5.0.20250531,<4.0.0.0)"
]

[tool.poetry]
packages = [{include = "app"}]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
python_files = "test_*.py"
# testpaths = "tests"
norecursedirs = ["__pycache__"]
asyncio_mode = "auto"

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    ]

[tool.poetry.scripts]
server = 'scripts.poetry:server'
lint = 'scripts.poetry:lint'
format = 'scripts.poetry:format'
unit_test = 'scripts.poetry:unit_test'
integration_test = 'scripts.poetry:integration_test'
build = 'scripts.poetry:build'
# migrations
migrate = 'scripts.poetry:migrate'
sqlmigrate = 'scripts.poetry:sqlmigrate'
makemigrations = 'scripts.poetry:make_migrations'
# production
prodution_server = 'scripts.poetry:prodution_server'
# docker
makerequirements = 'scripts.poetry:make_requirements'