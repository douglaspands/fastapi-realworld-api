services:
  api-service:
    image: localhost:32000/fastapi-realword-api:latest
    container_name: api-container
    build:
      dockerfile: Dockerfile
      context: .
    command: uvicorn main:app --workers 3 --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      # - db_url=sqlite+aiosqlite:///database.db
      - db_url=postgresql+psycopg://fastapi_user:123456@fastapi-realword-db:5432/fastapi
      - db_debug=1
      - token_secret_key=09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
      - TZ=America/Sao_Paulo
    networks:
      - realworld-network

  db-service:
    image: postgres:16.4-bookworm
    container_name: db-container
    command:
      [
        "postgres",
        "-c",
        "log_statement=all",
        "-c",
        "log_destination=stderr",
        "-c",
        "log_duration=on",
      ]
    shm_size: 128mb
    ports:
      - "5432:5432"
    volumes:
      - db-pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: fastapi
      TZ: America/Sao_Paulo
    networks:
      - realworld-network

volumes:
  db-pgdata:
    name: db-pgdata

networks:
  realworld-network:
    name: realworld-network
